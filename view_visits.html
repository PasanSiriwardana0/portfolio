<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Same head as before, but change title to view_visits.html -->
    <title>PST DEV | Visit Analytics</title>
    <!-- Include all the same CSS -->
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-chart-line"></i> VISIT ANALYTICS (Client-side)</h1>
        
        <div class="controls">
            <div>
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Back to Portfolio
                </a>
                <button class="btn btn-secondary" onclick="exportData()">
                    <i class="fas fa-download"></i> Export JSON
                </button>
                <button class="btn btn-secondary" onclick="clearData()">
                    <i class="fas fa-trash"></i> Clear Data
                </button>
            </div>
        </div>
        
        <div id="analytics-content">
            <!-- Content will be loaded by JavaScript -->
            <div class="no-data" id="loading">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 20px;"></i>
                <p>Loading visit data...</p>
            </div>
        </div>
    </div>

    <script>
        // Load and display visit data
        function loadVisitData() {
            const visits = JSON.parse(localStorage.getItem('visits') || '[]');
            const container = document.getElementById('analytics-content');
            
            if (visits.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-database" style="font-size: 3rem; margin-bottom: 20px; color: #444;"></i>
                        <p>No visit data available yet.</p>
                        <p>Visit the main portfolio page to generate visit logs.</p>
                    </div>
                `;
                return;
            }
            
            // Reverse to show newest first
            const reversedVisits = [...visits].reverse();
            
            // Calculate statistics
            const uniqueIPs = new Set(visits.map(v => v.ip));
            const today = new Date().toISOString().split('T')[0];
            const todayVisits = visits.filter(v => v.timestamp.startsWith(today)).length;
            const referrerVisits = visits.filter(v => v.referrer !== 'Direct' && v.referrer).length;
            
            // Generate HTML
            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${visits.length}</div>
                        <div class="stat-label">Total Visits</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-number">${uniqueIPs.size}</div>
                        <div class="stat-label">Unique Visitors</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-number">${todayVisits}</div>
                        <div class="stat-label">Today's Visits</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-number">${referrerVisits}</div>
                        <div class="stat-label">From Referrers</div>
                    </div>
                </div>
                
                <div class="visits-table-container">
                    <table id="visitsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Timestamp</th>
                                <th>IP</th>
                                <th>User Agent</th>
                                <th>Referrer</th>
                                <th>Page</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            reversedVisits.forEach((visit, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="timestamp">${new Date(visit.timestamp).toLocaleString()}</td>
                        <td class="ip-address">${visit.ip}</td>
                        <td class="user-agent" title="${visit.user_agent}">
                            ${visit.user_agent.substring(0, 50)}${visit.user_agent.length > 50 ? '...' : ''}
                        </td>
                        <td class="referrer" title="${visit.referrer}">
                            ${visit.referrer.substring(0, 30)}${visit.referrer.length > 30 ? '...' : ''}
                        </td>
                        <td>${visit.page}</td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                    <div class="footer" style="margin-top: 30px;">
                        <p>© ${new Date().getFullYear()} PST DEV Visit Analytics | Last updated: ${new Date().toLocaleString()}</p>
                        <p>Data stored in browser localStorage (clears when browser data is cleared)</p>
                        <p>Total storage used: ${JSON.stringify(visits).length} bytes</p>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            
            // Add search functionality
            setTimeout(() => {
                addSearchFunctionality();
            }, 100);
        }
        
        function addSearchFunctionality() {
            const searchBox = document.createElement('input');
            searchBox.type = 'text';
            searchBox.className = 'search-box';
            searchBox.placeholder = 'Search visits...';
            searchBox.style.marginBottom = '20px';
            searchBox.style.width = '100%';
            
            searchBox.addEventListener('input', function() {
                const filter = this.value.toLowerCase();
                const table = document.getElementById('visitsTable');
                if (!table) return;
                
                const rows = table.tBodies[0].rows;
                
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(filter) ? '' : 'none';
                }
            });
            
            const tableContainer = document.querySelector('.visits-table-container');
            if (tableContainer) {
                tableContainer.insertBefore(searchBox, tableContainer.firstChild);
            }
        }
        
        function exportData() {
            const visits = JSON.parse(localStorage.getItem('visits') || '[]');
            const dataStr = JSON.stringify(visits, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = `visits_export_${new Date().toISOString().split('T')[0]}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
        
        function clearData() {
            if (confirm('Are you sure you want to clear all visit data? This cannot be undone.')) {
                localStorage.removeItem('visits');
                sessionStorage.clear();
                loadVisitData();
            }
        }
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadVisitData);
    </script>
</body>
</html>
